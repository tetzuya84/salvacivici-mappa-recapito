name: SalvaCivici regression tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all regression tests
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          # Test della versione attuale. I vecchi test legati a UI/etichette
          # di Beta precedenti sono conservati nel repository, non eseguiti qui.
          tests=(
            capture-one-screen map-review-compact
            cloud-merge cloud-published-guard cloud-map-sync-guard compass-autostart compass-north compass-fast-response core drive-backup
            giro-preview giro-tab-swipe giro giro-drag giro-selection-order giro-optimizer giro-optimization-ui google-login gps-permissions
            gps-three-readings map-controls-overlap map-features map-layout
            map-overview map-review pull-viewport update-flow giro-centered
          )
          for name in "${tests[@]}"; do
            testfile="tests/${name}.test.js"
            echo "::group::$testfile"
            if node "$testfile"; then
              echo "PASS $testfile"
            else
              echo "::error file=$testfile::Regression test failed"
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done
          echo "Total failed: $failed"
          exit "$((failed>0))"
